<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>武器图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto;padding-bottom:60px}
h1{text-align:center;font-size:18px;color:#ffd700;margin:10px 0 14px}
.tier{margin-bottom:22px}
.tier-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:700}
.tier-ic{font-size:20px}
.tier-rng{font-size:10px;opacity:0.7;margin-left:auto;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{
  background:#1e1e3f;border-radius:10px;padding:8px 4px;
  text-align:center;min-height:95px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
}
.card-num{
  font-size:26px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#aaa 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.card-tier{font-size:16px;line-height:1}
.card-stars{font-size:9px;color:#ffd700;letter-spacing:1px;margin-top:2px}
.card-name{font-size:7px;color:#888;line-height:1.3;max-width:100%;overflow:hidden;padding:0 2px}
.card-lv{font-size:7px;color:#555;margin-top:auto}

/* Tier 1 - Steel */
.t1 .card::before{background:linear-gradient(90deg,#6b7280,#9ca3af,#6b7280)}
.t1 .card-num{background:linear-gradient(180deg,#d1d5db,#6b7280);-webkit-background-clip:text;background-clip:text}
.t1 .card-tier{filter:hue-rotate(0deg) saturate(0.3)}
/* Tier 2 - Electric */
.t2 .card::before{background:linear-gradient(90deg,#92400e,#fbbf24,#f59e0b)}
.t2 .card-num{background:linear-gradient(180deg,#fde68a,#d97706);-webkit-background-clip:text;background-clip:text}
/* Tier 3 - Fire */
.t3 .card::before{background:linear-gradient(90deg,#991b1b,#ef4444,#f87171)}
.t3 .card-num{background:linear-gradient(180deg,#fca5a5,#dc2626);-webkit-background-clip:text;background-clip:text}
/* Tier 4 - Ice */
.t4 .card::before{background:linear-gradient(90deg,#0369a1,#0ea5e9,#7dd3fc)}
.t4 .card-num{background:linear-gradient(180deg,#bae6fd,#0284c7);-webkit-background-clip:text;background-clip:text}
/* Tier 5 - Laser */
.t5 .card::before{background:linear-gradient(90deg,#7e22ce,#a855f7,#c084fc)}
.t5 .card-num{background:linear-gradient(180deg,#e9d5ff,#9333ea);-webkit-background-clip:text;background-clip:text}
/* Tier 6 - Void */
.t6 .card::before{background:linear-gradient(90deg,#030712,#4b5563,#111827)}
.t6 .card-num{background:linear-gradient(180deg,#9ca3af,#374151);-webkit-background-clip:text;background-clip:text}
/* Tier 7 - Holy */
.t7 .card::before{background:linear-gradient(90deg,#78350f,#f59e0b,#fde68a)}
.t7 .card-num{background:linear-gradient(180deg,#fef3c7,#b45309);-webkit-background-clip:text;background-clip:text}
/* Tier 8 - Cosmic */
.t8 .card::before{background:linear-gradient(90deg,#312e81,#6366f1,#c7d2fe)}
.t8 .card-num{background:linear-gradient(180deg,#c7d2fe,#4338ca);-webkit-background-clip:text;background-clip:text}
/* Tier 9 - Crystal */
.t9 .card::before{background:linear-gradient(90deg,#155e75,#06b6d4,#67e8f9)}
.t9 .card-num{background:linear-gradient(180deg,#cffafe,#0891b2);-webkit-background-clip:text;background-clip:text}
/* Tier 10 - Cosmic Orange */
.t10 .card::before{background:linear-gradient(90deg,#431407,#ea580c,#fed7aa)}
.t10 .card-num{background:linear-gradient(180deg,#fed7aa,#9a3412);-webkit-background-clip:text;background-clip:text}
.t10 .card{background:linear-gradient(180deg,#1e1e3f,#2d1500)}

/* Tier icon badges */
.tier-icons{display:flex;gap:3px;margin-top:2px}
.tier-icons span{font-size:12px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#16213e;border-top:1px solid #3a3a6a;padding:8px 16px;display:flex;justify-content:center;gap:8px;font-size:10px;color:#777;max-width:640px;margin:0 auto;flex-wrap:wrap}
</style>
</head>
<body>
<h1>武器收集大作战 · 完整图鉴</h1>
<div id="app"></div>
<div class="bar">
  <span>🔫起始</span><span>⚡能量</span><span>🔥烈焰</span><span>❄冰霜</span><span>💥激光</span><span>🌑暗黑</span><span>⭐神圣</span><span>🌌宇宙</span><span>💎终极</span><span>👑创世</span>
</div>
<script>
var TIERS=[
  {t:1,n:"起始之枪",e:"🔫"},
  {t:2,n:"能量之枪",e:"⚡"},
  {t:3,n:"烈焰之枪",e:"🔥"},
  {t:4,n:"冰霜之枪",e:"❄"},
  {t:5,n:"激光之枪",e:"💥"},
  {t:6,n:"暗黑之枪",e:"🌑"},
  {t:7,n:"神圣之枪",e:"⭐"},
  {t:8,n:"宇宙之枪",e:"🌌"},
  {t:9,n:"终极之枪",e:"💎"},
  {t:10,n:"创世之枪",e:"👑"},
];
var TC=["#4a5568","#d97706","#dc2626","#0ea5e9","#a855f7","#374151","#f59e0b","#6366f1","#0891b2","#ea580c"];
var NAMES=[
  ["玩具水枪","小弹弓枪","橡皮筋枪","软弹枪","木制手枪","塑料步枪","弹簧手枪","水弹枪","儿童猎枪","泡沫冲锋枪"],
  ["电动冲锋枪","加特林玩具枪","电光枪","电磁步枪","闪电冲锋枪","能量光枪","电弧手枪","特斯拉枪","脉冲冲锋枪","闪电之锤"],
  ["火焰喷射器","燃烧弹枪","烈焰步枪","火神枪","熔岩冲锋枪","烈焰之爪","红莲手枪","火焰风暴枪","爆炎步枪","焚天之怒"],
  ["冰冻射线枪","霜寒冲锋枪","冰晶步枪","雪崩之枪","寒冰光枪","极地猎枪","冰封射线","北极风暴枪","玄冰之矛","绝对零度"],
  ["激光手枪","激光步枪","光束冲锋枪","量子光枪","等离子步枪","光子手枪","射线猎枪","光棱冲锋枪","星际光枪","神光裁决"],
  ["暗影手枪","夜幕冲锋枪","幽灵步枪","暗夜猎手","虚空之枪","冥王射线","暗物质枪","幽冥冲锋枪","深渊猎手","暗夜裁决"],
  ["圣光手枪","天使之羽枪","神圣裁决","光之子步枪","天使长之枪","圣灵冲锋枪","神圣之光","天使圣剑","创世之光","圣光裁决"],
  ["星际手枪","银河步枪","彗星冲锋枪","黑洞射线枪","星云光枪","宇宙猎手","星际风暴","银河守护者","宇宙之心","银河裁决"],
  ["量子手枪","全息步枪","时空猎枪","维度冲锋枪","平行光枪","未来射线","永恒之枪","时空领主","多元宇宙枪","维度裁决"],
  ["起源之枪","原初之光","万物之枪","永恒星杖","宇宙法则枪","时间领主","命运裁决","天道之枪","万物归一","创世神枪"],
];

var html = "";
TIERS.forEach(function(t, ti) {
  html += '<div class="tier t' + t.t + '">';
  html += '<div class="tier-hd" style="background:' + TC[t.t-1] + '22;border-left:3px solid ' + TC[t.t-1] + ';color:' + TC[t.t-1] + '">';
  html += '<span class="tier-ic">' + t.e + '</span>';
  html += '<span>' + t.n + '</span>';
  html += '<span class="tier-rng">Lv.' + ((t.t-1)*10+1) + '-' + (t.t*10) + '</span>';
  html += '</div>';
  html += '<div class="grid">';
  for (var i = 0; i < 10; i++) {
    var lv = (t.t-1)*10 + i + 1;
    var name = NAMES[t.t-1][i];
    var stars = "";
    var starCount = Math.ceil(lv / 20);
    for (var s = 0; s < starCount; s++) stars += "★";
    html += '<div class="card">';
    html += '<div class="card-tier">' + t.e + '</div>';
    html += '<div class="card-num">' + lv + '</div>';
    html += '<div class="card-stars">' + stars + '</div>';
    html += '<div class="card-name">' + name + '</div>';
    html += '</div>';
  }
  html += '</div></div>';
});
document.getElementById("app").innerHTML = html;
</script>
</body>
</html>
