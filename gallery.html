<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin:0 auto;padding-bottom:70px}
h1{text-align:center;font-size:20px;color:#ffd700;margin:12px 0 16px}
.tier{margin-bottom:24px}
.tier-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;
  margin-bottom:10px;font-size:13px;font-weight:700;
}
.tier-icon{font-size:20px}
.tier-range{font-size:10px;opacity:0.7;margin-left:auto;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
@media(min-width:480px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{
  background:#1e1e3f;border-radius:10px;padding:6px;
  text-align:center;min-height:108px;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:transform 0.15s;cursor:default;
}
.card:active{transform:scale(0.95)}
.card-name{font-size:8px;color:#b0b0b0;line-height:1.3;max-width:100%;overflow:hidden;min-height:16px}
.card-lv{font-size:7px;color:#555;margin-top:auto}
.canvas-wrap{border-radius:4px;overflow:hidden;background:#0a0a15}
canvas{display:block;image-rendering:pixelated}
.fixed-bar{
  position:fixed;bottom:0;left:0;right:0;background:#16213e;
  border-top:1px solid #3a3a6a;padding:10px 20px;
  display:flex;justify-content:center;gap:16px;font-size:11px;color:#888;
  max-width:640px;margin:0 auto;
}
</style>

  ["暗影手枪","夜幕冲锋枪","幽灵步枪","暗夜猎手","虚空之枪","冥王射线","暗物质枪","幽冥冲锋枪","深渊猎手","暗夜裁决"],
  ["圣光手枪","天使之羽枪","神圣裁决","光之子步枪","天使长之枪","圣灵冲锋枪","神圣之光","天使圣剑","创世之光","圣光裁决"],

  ["量子手枪","全息步枪","时空猎枪","维度冲锋枪","平行光枪","未来射线","永恒之枪","时空领主","多元宇宙枪","维度裁决"],
  ["起源之枪","原初之光","万物之枪","永恒星杖","宇宙法则枪","时间领主","命运裁决","天道之枪","万物归一","创世神枪"],

// ─── Seeded random ────────────────────────────────────────────────────────
function seededRand(seed) {
  var s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function nameSeed(name) {
  var h = 0;
  for(var i=0;i<name.length;i++){
    h = ((h<<5) - h + name.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

// ─── Pixel drawing helpers ──────────────────────────────────────────────────
function drawPixel(c, x, y, color) {
  c.fillStyle = color;
  c.fillRect(x*4, y*4, 4, 4);
}

function drawRect(c, px, py, pw, ph, color) {
  c.fillStyle = color;
  c.fillRect(px*4, py*4, pw*4, ph*4);
}

function drawHLine(c, x, y, len, color) {
  c.fillStyle = color;
  c.fillRect(x*4, y*4, len*4, 4);
}

function drawVLine(c, x, y, len, color) {
  c.fillStyle = color;
  c.fillRect(x*4, y*4, 4, len*4);
}

function darken(color, amount) {
  // Simple darken: parse hex
  var r = parseInt(color.slice(1,3),16);
  var g = parseInt(color.slice(3,5),16);
  var b = parseInt(color.slice(5,7),16);
  r = Math.max(0, Math.floor(r * (1-amount)));
  g = Math.max(0, Math.floor(g * (1-amount)));
  b = Math.max(0, Math.floor(b * (1-amount)));
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

function lighten(color, amount) {
  var r = parseInt(color.slice(1,3),16);
  var g = parseInt(color.slice(3,5),16);
  var b = parseInt(color.slice(5,7),16);
  r = Math.min(255, Math.floor(r + (255-r)*amount));
  g = Math.min(255, Math.floor(g + (255-g)*amount));
  b = Math.min(255, Math.floor(b + (255-b)*amount));
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

// ─── Unique weapon icon generator ───────────────────────────────────────────
function drawWeaponIcon(canvas, lv, tier, name, rank) {
  var SZ = 12; // canvas is 12x12 "pixels", each drawn as 4x4 real pixels = 48x48 canvas
  canvas.width = SZ*4;
  canvas.height = SZ*4;
  var c = canvas.getContext('2d');
  c.imageSmoothingEnabled = false;
  var rng = seededRand(nameSeed(name) + lv * 997 + tier * 31337);

  var pal = PALETTES[tier-1];
  var main = pal[0];
  var mid = pal[1];
  var light = pal[2];
  var dark = pal[3];
  var hl = pal[4];
  var shadow = pal[5];

  // Clear
  c.fillStyle = '#0a0a15';
  c.fillRect(0,0,canvas.width,canvas.height);

  // Determine weapon "class" by name chars
  var classIdx = Math.floor(rng() * 6);

  // ── TYPE 0: Diamond gem ────────────────────────────────────────────────
  if (classIdx === 0) {
    var cx=5, cy=5;
    for(var y=0;y<SZ;y++){
      for(var x=0;x<SZ;x++){
        var d = Math.abs(x-cx)+Math.abs(y-cy);
        if(d<=5){
          var col = d<=1 ? hl : d<=3 ? main : d<=4 ? mid : dark;
          drawPixel(c,x,y,col);
        }
      }
    }
    // Inner highlight
    drawPixel(c,cx,cy-2,light);
    drawPixel(c,cx-1,cy-1,light);
    drawPixel(c,cx+1,cy-1,light);
    // Corner cuts
    var corners = [[1,1],[1,10],[10,1],[10,10]];
    corners.forEach(function(pt){ drawPixel(c,pt[0],pt[1],'#0a0a15'); });
    // Border sparkle
    drawPixel(c,2,5,lighten(light,0.5));
    drawPixel(c,9,5,lighten(light,0.5));
    drawPixel(c,5,2,lighten(light,0.5));
    drawPixel(c,5,9,lighten(light,0.5));
    // Level stars
    var starX = 1;
    for(var si=0;si<Math.min(Math.floor(lv/20)+1,3);si++){
      drawPixel(c,starX+si,11,'#ffd700');
    }
    // Border
    drawHLine(c,2,0,8,dark);
    drawHLine(c,0,2,1,dark);
    drawHLine(c,11,2,1,dark);
    drawVLine(c,0,2,1,dark);
    drawVLine(c,11,2,1,dark);
    return;
  }

  // ── TYPE 1: Sword shape ────────────────────────────────────────────────
  if (classIdx === 1) {
    // Blade
    for(var y=0;y<9;y++){
      var w = y<2 ? 2 : y<5 ? 3 : y<7 ? 2 : 1;
      var col = y<4 ? main : y<7 ? mid : dark;
      for(var x=5-w;x<=5+w;x++) drawPixel(c,x,y,col);
    }
    // Guard
    drawHLine(c,2,9,8,light);
    drawHLine(c,3,10,6,mid);
    // Handle
    drawVLine(c,5,11,1,main);
    drawPixel(c,5,11,dark);
    // Fullers (grooves)
    if(lv%3!==0){ drawVLine(c,5,1,6,lighten(light,0.3)); }
    // Gem in guard
    if(lv%2===0){ drawPixel(c,5,9,hl); drawPixel(c,4,9,hl); }
    // Pommel
    drawRect(c,4,12,4,1,main);
    drawPixel(c,4,12,light);
    drawPixel(c,7,12,dark);
    // Edge highlight
    for(var y=1;y<8;y+=2){
      var ex = 5+Math.floor((y<4?1:0)+(y<2?1:0));
      drawPixel(c,ex,y,light);
    }
    // Level indicator dots
    var dots = Math.floor((lv-1)/33);
    for(var di=0;di<dots;di++){
      drawPixel(c,2+di*2,2,light);
    }
    return;
  }

  // ── TYPE 2: Shield / hexagon ─────────────────────────────────────────
  if (classIdx === 2) {
    var pts = [[5,0],[9,2],[9,7],[7,11],[3,11],[1,7],[1,2]];
    var on = function(x,y){
      // Check if point is inside hexagon-ish shape
      var inUpper = y<=5 ? (x>=1 && x<=9 && Math.abs(x-5)+y<=6) : (x>=1 && x<=9 && Math.abs(x-5)+(11-y)<=6);
      var inShield = y<=2 ? (x>=3&&x<=7&&y>=0) : inUpper || (x>=1&&x<=3&&y>=5&&y<=7) || (x>=9&&x<=11&&y>=5&&y<=7) || (x>=3&&x<=7&&y>=9&&y<=11);
      return inUpper;
    };
    for(var y2=0;y2<SZ;y2++){
      for(var x2=0;x2<SZ;x2++){
        if(on(x2,y2)){
          var distC = Math.sqrt((x2-5)*(x2-5)+(y2-5)*(y2-5));
          var col = distC<2?hl:distC<4?main:distC<5?mid:dark;
          drawPixel(c,x2,y2,col);
        }
      }
    }
    // Inner emblem - unique based on name seed
    var emx = 3 + Math.floor(rng()*6);
    var emy = 3 + Math.floor(rng()*6);
    for(var dy=-1;dy<=1;dy++){
      for(var dx=-1;dx<=1;dx++){
        if(Math.abs(dx)+Math.abs(dy)<=1){
          drawPixel(c,emx+dx,emy+dy,lighten(light,0.4));
        }
      }
    }
    // Border ring
    drawHLine(c,2,0,8,dark);
    drawHLine(c,1,11,8,dark);
    // Corner rivets
    [[1,1],[9,1],[1,10],[9,10]].forEach(function(pt){
      drawPixel(c,pt[0],pt[1],light);
    });
    // Level bar at bottom
    var filled = Math.ceil(lv/10);
    for(var bi=0;bi<filled;bi++){
      drawPixel(c,1+bi,11,light);
    }
    return;
  }

  // ── TYPE 3: Spiral / energy core ─────────────────────────────────────
  if (classIdx === 3) {
    // Draw spiral arms
    for(var angle2=0;angle2<lv*36+360;angle2+=15){
      var rad = angle2 * Math.PI / 180;
      var arm = Math.floor(angle2 / (lv*3+60));
      var arms = 3 + tier%3;
      for(var r2=1;r2<5;r2++){
        var ax = 5 + Math.floor(Math.cos(rad * (arm+1)) * r2);
        var ay = 5 + Math.floor(Math.sin(rad * (arm+1)) * r2);
        if(ax>=0&&ax<SZ&&ay>=0&&ay<SZ){
          var col = r2<2?hl:r2<3?main:mid;
          drawPixel(c,ax,ay,col);
        }
      }
    }
    // Center glow
    for(var cy2=-1;cy2<=1;cy2++){
      for(var cx2=-1;cx2<=1;cx2++){
        drawPixel(c,5+cx2,5+cy2,hl);
      }
    }
    // Core ring
    for(var ri=0;ri<8;ri++){
      var r3 = 4;
      var rx = 5 + Math.floor(Math.cos(ri*Math.PI/4)*r3);
      var ry = 5 + Math.floor(Math.sin(ri*Math.PI/4)*r3);
      drawPixel(c,rx,ry,main);
    }
    // Pulsing rings
    var ringR = (lv+5)%5;
    for(var ri2=0;ri2<8;ri2++){
      var r4 = ringR;
      var rx2 = 5 + Math.floor(Math.cos(ri2*Math.PI/4)*r4);
      var ry2 = 5 + Math.floor(Math.sin(ri2*Math.PI/4)*r4);
      if(rx2>=0&&rx2<SZ&&ry2>=0&&ry2<SZ){
        drawPixel(c,rx2,ry2,lighten(light,0.5));
      }
    }
    // Corner decorations
    [[0,0],[11,0],[0,11],[11,11]].forEach(function(pt){
      drawPixel(c,pt[0],pt[1],dark);
    });
    return;
  }

  // ── TYPE 4: Cross / holy symbol ───────────────────────────────────────
  if (classIdx === 4) {
    // Vertical bar
    drawVLine(c,5,0,12,main);
    drawVLine(c,5,0,12,main);
    // Horizontal bar
    drawHLine(c,1,4,10,main);
    drawHLine(c,2,5,8,mid);
    // Center jewel
    drawRect(c,4,3,4,4,light);
    drawPixel(c,5,4,hl);
    // Holy rays
    var rayAngles = [0,60,120,180,240,300];
    rayAngles.forEach(function(a){
      var rad2 = a * Math.PI / 180;
      for(var r5=4;r5<6;r5++){
        var rx3 = 5 + Math.floor(Math.cos(rad2)*r5);
        var ry3 = 5 + Math.floor(Math.sin(rad2)*r5);
        if(rx3>=0&&rx3<SZ&&ry3>=0&&ry3<SZ){
          drawPixel(c,rx3,ry3,light);
        }
      }
    });
    // Flanking gems
    drawPixel(c,3,4,hl);
    drawPixel(c,7,4,hl);
    // Top crown points
    drawPixel(c,5,0,light);
    drawPixel(c,4,1,light);
    drawPixel(c,6,1,light);
    // Level cross overlay
    var crossSize = Math.min(Math.floor(lv/20)+1,3);
    for(var ci=-crossSize;ci<=crossSize;ci++){
      if(Math.abs(ci)>crossSize-1){
        drawPixel(c,5+ci,9,dark);
        drawPixel(c,5+ci,10,dark);
      }
    }
    return;
  }

  // ── TYPE 5: Star / cosmic ─────────────────────────────────────────────
  if (classIdx === 5) {
    var starR = 5;
    var innerR = 2;
    for(var sy=0;sy<SZ;sy++){
      for(var sx=0;sx<SZ;sx++){
        var dx = sx-5, dy = sy-5;
        var d = Math.sqrt(dx*dx+dy*dy);
        if(d<=starR){
          var angle3 = Math.atan2(dy,dx);
          var starPoint = (angle3 + Math.PI) / (2*Math.PI/5);
          var adjusted = starPoint - Math.floor(starPoint);
          var distFromStar = Math.abs(adjusted-0.5);
          var inStar = d <= (distFromStar < 0.2 ? starR : innerR + (starR-innerR)*distFromStar*4);
          if(inStar){
            var col = d<2?hl:d<3?light:main:d<4?mid:dark;
            drawPixel(c,sx,sy,col);
          }
        }
      }
    }
    // Star sparkle lines
    [[5,0],[5,11],[0,5],[11,5]].forEach(function(pt2){
      drawPixel(c,pt2[0],pt2[1],lighten(light,0.5));
    });
    // Center orb
    drawPixel(c,5,5,hl);
    drawPixel(c,4,5,light);
    drawPixel(c,6,5,light);
    // Level constellation dots
    var numDots = Math.min(Math.floor(lv/20)+1,4);
    var dotAngle = lv * 0.3;
    for(var di2=0;di2<numDots;di2++){
      var da = (dotAngle + di2*(Math.PI*2/numDots));
      var dd = 5 + Math.floor(Math.cos(da)*3);
      var ddy = 5 + Math.floor(Math.sin(da)*3);
      if(dd>=0&&dd<SZ&&ddy>=0&&ddy<SZ){
        drawPixel(c,dd,ddy,light);
      }
    }
    return;
  }

  // ── Default fallback: geometric ────────────────────────────────────────
  // Grid pattern unique to each weapon
  var grid = Math.floor(rng()*3);
  if(grid===0){
    // Checkerboard
    for(var gy=0;gy<SZ;gy++){
      for(var gx=0;gx<SZ;gx++){
        if((gx+gy)%2===0) drawPixel(c,gx,gy,main);
      }
    }
    drawRect(c,2,2,8,8,mid);
    drawRect(c,4,4,4,4,light);
    drawPixel(c,5,5,hl);
  } else if(grid===1) {
    // Concentric squares
    for(var s=0;s<SZ/2;s++){
      var sc = (s%2===0)?main:mid;
      if(s===0) sc=light;
      if(s>=SZ/2-1) sc=dark;
      drawRect(c,s,s,SZ-s*2,SZ-s*2,sc);
    }
    drawPixel(c,5,5,hl);
  } else {
    // Diagonal stripes
    for(var dy2=0;dy2<SZ;dy2++){
      for(var dx2=0;dx2<SZ;dx2++){
        if((dx2+dy2)%3===0) drawPixel(c,dx2,dy2,main);
      }
    }
    drawRect(c,3,3,6,6,mid);
    drawRect(c,4,4,4,4,light);
    drawPixel(c,5,5,hl);
  }
}

// ─── Render all ────────────────────────────────────────────────────────────
var TIERS=[
  {t:1,n:"起始之枪",e:"🔫"},
  {t:2,n:"能量之枪",e:"⚡"},
  {t:3,n:"烈焰之枪",e:"🔥"},
  {t:4,n:"冰霜之枪",e:"❄"},
  {t:5,n:"激光之枪",e:"💥"},
  {t:6,n:"暗黑之枪",e:"🌑"},
  {t:7,n:"神圣之枪",e:"⭐"},
  {t:8,n:"宇宙之枪",e:"🌌"},
  {t:9,n:"终极之枪",e:"💎"},
  {t:10,n:"创世之枪",e:"👑"},
];
var TIER_COLORS=['#4a5568','#d97706','#dc2626','#0ea5e9','#a855f7','#374151','#f59e0b','#6366f1','#0891b2','#ea580c'];

var html='<div>';
TIERS.forEach(function(t){
  var c=TIER_COLORS[t.t-1];
  html+='<div class="tier">';
  html+='<div class="tier-head" style="background:'+c+'22;border-left:3px solid '+c+';color:'+c+'">';
  html+='<span class="tier-icon">'+t.e+'</span>';
  html+='<span>'+t.n+'</span>';
  html+='<span class="tier-range">Lv.'+((t.t-1)*10+1)+'–'+(t.t*10)+'</span>';
  html+='</div>';
  html+='<div class="grid">';
  for(var i=0;i<10;i++){
    var lv=(t.t-1)*10+i+1;
    var name=NAMES[t.t-1][i];
    html+='<div class="card">';
    html+='<div class="canvas-wrap"><canvas id="w'+lv+'" width="48" height="48"></canvas></div>';
    html+='<div class="card-name">'+name+'</div>';
    html+='<div class="card-lv">Lv.'+lv+'</div>';
    html+='</div>';
  }
  html+='</div></div>';
});
html+='</div>';
document.getElementById('app').innerHTML=html;

// Draw all icons
TIERS.forEach(function(t){
  for(var i=0;i<10;i++){
    var lv=(t.t-1)*10+i+1;
    var name=NAMES[t.t-1][i];
    var canvas=document.getElementById('w'+lv);
    if(canvas) drawWeaponIcon(canvas,lv,t.t,name,i);
  }
});
</script>
</body>
