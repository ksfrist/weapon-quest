<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>武器图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto;padding-bottom:60px}
h1{text-align:center;font-size:18px;color:#ffd700;margin:10px 0 14px}
.tier{margin-bottom:22px}
.tier-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:700}
.tier-ic{font-size:20px}
.tier-rng{font-size:10px;opacity:0.7;margin-left:auto;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{
  background:#1e1e3f;border-radius:12px;padding:6px 3px;
  text-align:center;min-height:100px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  position:relative;overflow:hidden;
  transition:transform 0.15s;
}
.card:active{transform:scale(0.95)}

/* Top color bar per tier */
.t1 .card{border-top:3px solid #6b7280}
.t2 .card{border-top:3px solid #d97706}
.t3 .card{border-top:3px solid #dc2626}
.t4 .card{border-top:3px solid #0ea5e9}
.t5 .card{border-top:3px solid #a855f7}
.t6 .card{border-top:3px solid #4b5563}
.t7 .card{border-top:3px solid #f59e0b}
.t8 .card{border-top:3px solid #6366f1}
.t9 .card{border-top:3px solid #06b6d4}
.t10 .card{border-top:3px solid #ea580c}

/* Background gradient per tier */
.t1 .card{background:linear-gradient(180deg,#1e1e3f 70%,#2d3748 100%)}
.t2 .card{background:linear-gradient(180deg,#1e1e3f 70%,#29200a 100%)}
.t3 .card{background:linear-gradient(180deg,#1e1e3f 70%,#2a0f0f 100%)}
.t4 .card{background:linear-gradient(180deg,#1e1e3f 70%,#0a1f2a 100%)}
.t5 .card{background:linear-gradient(180deg,#1e1e3f 70%,#1a0a2a 100%)}
.t6 .card{background:linear-gradient(180deg,#1e1e3f 70%,#0a0a0a 100%)}
.t7 .card{background:linear-gradient(180deg,#1e1e3f 70%,#2a1f00 100%)}
.t8 .card{background:linear-gradient(180deg,#1e1e3f 70%,#0f0a2a 100%)}
.t9 .card{background:linear-gradient(180deg,#1e1e3f 70%,#0a1f2a 100%)}
.t10 .card{background:linear-gradient(180deg,#1e1e3f 70%,#2a1000 100%)}

/* Icon row */
.icon-row{display:flex;align-items:center;justify-content:center;gap:1px;font-size:16px;line-height:1}
.tier-emoji{font-size:18px}
.weapon-emoji{font-size:14px}

/* Number */
.weapon-num{
  font-size:22px;font-weight:900;line-height:1;
  font-family:"Arial Black",Arial,sans-serif;
}
.t1 .weapon-num{color:#9ca3af}
.t2 .weapon-num{color:#fbbf24}
.t3 .weapon-num{color:#f87171}
.t4 .weapon-num{color:#38bdf8}
.t5 .weapon-num{color:#c084fc}
.t6 .weapon-num{color:#6b7280}
.t7 .weapon-num{color:#fcd34d}
.t8 .weapon-num{color:#a5b4fc}
.t9 .weapon-num{color:#67e8f9}
.t10 .weapon-num{color:#fb923c}

/* Stars */
.stars{font-size:9px;letter-spacing:1px;color:#ffd700}

/* Name */
.weapon-name{font-size:7px;color:#888;line-height:1.3;max-width:100%;word-break:break-all;padding:0 2px}

/* Rarity badge */
.rarity{
  position:absolute;top:4px;right:4px;
  font-size:8px;padding:1px 3px;border-radius:3px;font-weight:700;
}
.t1 .rarity{background:#4b5563;color:#fff}
.t2 .rarity{background:#92400e;color:#fef3c7}
.t3 .rarity{background:#991b1b;color:#fecaca}
.t4 .rarity{background:#0369a1;color:#bae6fd}
.t5 .rarity{background:#7e22ce;color:#f3e8ff}
.t6 .rarity{background:#1f2937;color:#9ca3af}
.t7 .rarity{background:#b45309;color:#fef3c7}
.t8 .rarity{background:#4338ca;color:#e0e7ff}
.t9 .rarity{background:#0e7490;color:#cffafe}
.t10 .rarity{background:#9a3412;color:#fed7aa}

.bar{position:fixed;bottom:0;left:0;right:0;background:#16213e;border-top:1px solid #3a3a6a;padding:8px 16px;display:flex;justify-content:center;gap:8px;font-size:10px;color:#777;max-width:640px;margin:0 auto;flex-wrap:wrap}
</style>
</head>
<body>
<h1>武器收集大作战 · 完整图鉴</h1>
<div id="app"></div>
<div class="bar">
  <span>🔫起始</span><span>⚡能量</span><span>🔥烈焰</span><span>❄冰霜</span><span>💥激光</span><span>🌑暗黑</span><span>⭐神圣</span><span>🌌宇宙</span><span>💎终极</span><span>👑创世</span>
</div>
<script>
var TIERS=[
  {t:1,n:"起始之枪",e:"🔫",c:"#6b7280"},
  {t:2,n:"能量之枪",e:"⚡",c:"#d97706"},
  {t:3,n:"烈焰之枪",e:"🔥",c:"#dc2626"},
  {t:4,n:"冰霜之枪",e:"❄",c:"#0ea5e9"},
  {t:5,n:"激光之枪",e:"💥",c:"#a855f7"},
  {t:6,n:"暗黑之枪",e:"🌑",c:"#374151"},
  {t:7,n:"神圣之枪",e:"⭐",c:"#f59e0b"},
  {t:8,n:"宇宙之枪",e:"🌌",c:"#6366f1"},
  {t:9,n:"终极之枪",e:"💎",c:"#06b6d4"},
  {t:10,n:"创世之枪",e:"👑",c:"#ea580c"},
];

// 武器类型图标池 - 60种不同图标组合
var WEAPON_ICONS=[
  "🔫","🏹","💣","🎯","🗡️","⚔️","🔪","🪃","🪄","🪃",
  "⚡","🔋","💡","✨","🌟","⭐","💫","🌩️","⚡","🔱",
  "🔥","💥","🌋","🌪️","🌈","💎","🔮","🧿","📿","🏆",
  "❄","🌨️","💠","🔷","🔵","💧","🌊","🧊","⚗️","🔬",
  "🌌","🌠","☄️","🪐","🌍","🚀","🛸","⭐","🌙","☀️",
  "👑","🏅","🎖️","🛡️","🔱","⚱️","🏺","📜","🔮","💠"
];

var NAMES=[
  ["玩具水枪","小弹弓枪","橡皮筋枪","软弹枪","木制手枪","塑料步枪","弹簧手枪","水弹枪","儿童猎枪","泡沫冲锋枪"],
  ["电动冲锋枪","加特林玩具枪","电光枪","电磁步枪","闪电冲锋枪","能量光枪","电弧手枪","特斯拉枪","脉冲冲锋枪","闪电之锤"],
  ["火焰喷射器","燃烧弹枪","烈焰步枪","火神枪","熔岩冲锋枪","烈焰之爪","红莲手枪","火焰风暴枪","爆炎步枪","焚天之怒"],
  ["冰冻射线枪","霜寒冲锋枪","冰晶步枪","雪崩之枪","寒冰光枪","极地猎枪","冰封射线","北极风暴枪","玄冰之矛","绝对零度"],
  ["激光手枪","激光步枪","光束冲锋枪","量子光枪","等离子步枪","光子手枪","射线猎枪","光棱冲锋枪","星际光枪","神光裁决"],
  ["暗影手枪","夜幕冲锋枪","幽灵步枪","暗夜猎手","虚空之枪","冥王射线","暗物质枪","幽冥冲锋枪","深渊猎手","暗夜裁决"],
  ["圣光手枪","天使之羽枪","神圣裁决","光之子步枪","天使长之枪","圣灵冲锋枪","神圣之光","天使圣剑","创世之光","圣光裁决"],
  ["星际手枪","银河步枪","彗星冲锋枪","黑洞射线枪","星云光枪","宇宙猎手","星际风暴","银河守护者","宇宙之心","银河裁决"],
  ["量子手枪","全息步枪","时空猎枪","维度冲锋枪","平行光枪","未来射线","永恒之枪","时空领主","多元宇宙枪","维度裁决"],
  ["起源之枪","原初之光","万物之枪","永恒星杖","宇宙法则枪","时间领主","命运裁决","天道之枪","万物归一","创世神枪"],
];

var html = "";
TIERS.forEach(function(tier) {
  html += '<div class="tier t' + tier.t + '">';
  html += '<div class="tier-hd" style="background:' + tier.c + '22;border-left:3px solid ' + tier.c + ';color:' + tier.c + '">';
  html += '<span class="tier-ic">' + tier.e + '</span>';
  html += '<span>' + tier.n + '</span>';
  html += '<span class="tier-rng">Lv.' + ((tier.t-1)*10+1) + '-' + (tier.t*10) + '</span>';
  html += '</div>';
  html += '<div class="grid">';

  for (var i = 0; i < 10; i++) {
    var lv = (tier.t-1)*10 + i + 1;
    var name = NAMES[tier.t-1][i];
    // 每把枪的图标 = 等级图标 + 武器类型图标（唯一组合）
    var weaponIcon = WEAPON_ICONS[(lv - 1) % WEAPON_ICONS.length];
    var stars = "";
    var starCount = Math.min(Math.ceil(lv / 20), 5);
    for (var s = 0; s < starCount; s++) stars += "★";
    var rarityText = starCount === 5 ? "传奇" : starCount === 4 ? "史诗" : starCount === 3 ? "稀有" : starCount === 2 ? "优秀" : "普通";

    html += '<div class="card">';
    html += '<span class="rarity">' + rarityText + '</span>';
    html += '<div class="icon-row">';
    html += '<span class="tier-emoji">' + tier.e + '</span>';
    html += '<span class="weapon-emoji">' + weaponIcon + '</span>';
    html += '</div>';
    html += '<div class="weapon-num">' + lv + '</div>';
    html += '<div class="stars">' + stars + '</div>';
    html += '<div class="weapon-name">' + name + '</div>';
    html += '</div>';
  }

  html += '</div></div>';
});
document.getElementById("app").innerHTML = html;
</script>
</body>
</html>
