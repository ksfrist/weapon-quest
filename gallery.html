<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;max-width:600px;margin:0 auto;padding-bottom:60px}
h1{text-align:center;font-size:22px;color:#ffd700;margin-bottom:20px;padding-top:10px}
.tier{margin-bottom:28px}
.tier-title{
  font-size:15px;font-weight:700;padding:8px 14px;border-radius:10px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.tier-title .emoji{font-size:20px}
.tier-title .name{font-size:15px}
.weapon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:500px){.weapon-grid{grid-template-columns:repeat(5,1fr)}}
.wp{
  background:#1e1e3f;border:1px solid #3a3a6a;border-radius:12px;
  padding:10px 4px;text-align:center;min-height:80px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.wp .e{font-size:26px}
.wp .n{font-size:10px;color:#b0b0b0;line-height:1.3}
.wp .lv{font-size:9px;color:#666}
.wp.all .e{font-size:26px}
.wp.all .n{color:#e0e0e0}
.wp.locked .e{font-size:20px;opacity:0.4}
.wp.locked .n{color:#555}
.wp.locked .lv{color:#444}
.wp:nth-child(10n+1){border-color:rgba(157,78,221,0.4)}
.legend{
  position:fixed;bottom:0;left:0;right:0;background:#16213e;
  border-top:1px solid #3a3a6a;padding:10px 20px;
  display:flex;justify-content:center;gap:20px;font-size:12px;color:#b0b0b0;
  max-width:600px;margin:0 auto;
}
.legend span{display:flex;align-items:center;gap:4px}
</style>
</head>
