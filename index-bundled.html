<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ 武器收集大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;
  --purple:#9d4edd;--purple2:#c77dff;--gold:#ffd700;
  --green:#00d26a;--red:#ff6b6b;--text:#e0e0e0;--text2:#b0b0b0;
  --card:#1e1e3f;--card2:#252550;--border:#3a3a6a;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
  /* 用 dvh 兼容手机浏览器地址栏问题，iOS Safari 也支持 */
  height:100vh;
  height:100dvh;
  /* 旧版浏览器 fallback */
  min-height:-webkit-fill-available;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#6b21a8 0%,#9d4edd 50%,#7c3aed 100%);
  padding:12px 16px 10px;text-align:center;flex-shrink:0;
  box-shadow:0 2px 12px rgba(157,78,221,0.4);
  position:relative;
}
.header h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px}
.header-sub{font-size:11px;color:rgba(255,255,255,0.8);margin-top:2px}
.settings-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,0.15);border:none;border-radius:50%;
  width:32px;height:32px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.page{display:none}

/* HOME */
.home-name{font-size:22px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:4px}
.home-level{text-align:center;margin-bottom:14px}
.lv-badge{background:linear-gradient(135deg,#7c3aed,#9d4edd);border-radius:20px;padding:4px 14px;font-size:12px;color:#fff;font-weight:600}
.streak-badge{background:rgba(255,107,107,0.2);border:1px solid var(--red);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--red);margin-left:8px}
.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.hs-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-height:64px;justify-content:center;
}
.hs-emoji{font-size:18px}
.hs-val{font-size:17px;font-weight:700;color:var(--gold)}
.hs-label{font-size:10px;color:var(--text2)}
.home-wp{
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border:2px solid var(--purple);border-radius:16px;padding:14px;
  text-align:center;margin-bottom:10px;box-shadow:0 0 20px rgba(157,78,221,0.2);
}
.wp-eyebrow{font-size:12px;color:var(--purple2);margin-bottom:4px}
.wp-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px}
.frag-bar-wrap{text-align:left}
.frag-bar{background:var(--card2);border-radius:8px;height:8px;overflow:hidden;border:1px solid var(--border)}
.frag-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#06b6d4,#22d3ee);transition:width 0.5s}
.frag-hint{font-size:11px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-row{margin-bottom:10px}
.xp-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.bar-bg{background:var(--card2);border-radius:8px;height:8px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:8px;transition:width 0.5s}
.xp-fill{background:linear-gradient(90deg,#7c3aed,#a855f7)}
.cta-card{
  background:var(--card);border:2px solid var(--purple);border-radius:14px;padding:14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all 0.2s;margin-top:4px;touch-action:manipulation;
}
.cta-card:active{transform:scale(0.98);background:rgba(157,78,221,0.1)}
.cta-icon{font-size:28px}
.cta-body{flex:1}
.cta-title{font-size:16px;font-weight:600;color:#fff}
.cta-warn{font-size:12px;color:var(--red);margin-top:2px}
.cta-sub{font-size:12px;color:var(--text2);margin-top:2px}
.cta-arrow{font-size:24px;color:var(--purple2)}

/* TASKS */
.view-tabs{display:flex;gap:6px;margin-bottom:10px}
.tab-btn{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:9px;color:var(--text2);font-size:13px;cursor:pointer;text-align:center;
  transition:all 0.2s;font-family:inherit;
}
.tab-btn.active{background:rgba(157,78,221,0.2);border-color:var(--purple);color:var(--purple2);font-weight:600}
.icon-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.ic-opt{
  font-size:18px;padding:4px;cursor:pointer;border-radius:8px;
  transition:all 0.15s;display:inline-block;line-height:1;
}
.ic-opt:active{transform:scale(1.2)}
.ic-opt.ic-sel{background:rgba(157,78,221,0.3);border-radius:8px}
.add-row{display:flex;gap:6px;margin-bottom:10px}
.add-row input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.add-row input:focus{border-color:var(--purple)}
.add-row input::placeholder{color:var(--text2)}
.btn-add{
  background:linear-gradient(135deg,#7c3aed,#9d4edd);border:none;border-radius:12px;
  padding:10px 14px;color:#fff;font-size:18px;cursor:pointer;font-weight:600;
  min-width:48px;min-height:48px;touch-action:manipulation;
}
.task-list{margin-bottom:8px}
.task-item{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px;margin-bottom:6px;
}
.task-item.task-done{border-color:var(--green);background:rgba(0,210,106,0.05)}
.task-item.task-imp{border-left:3px solid var(--gold)}
.task-row{display:flex;align-items:center;gap:8px}
.tcheck{font-size:20px;cursor:pointer;flex-shrink:0;min-width:28px;text-align:center;touch-action:manipulation}
.ticon{font-size:16px;flex-shrink:0}
.ttext{flex:1;font-size:14px;word-break:break-all}
.ttext.tdone{text-decoration:line-through;color:var(--text2)}
.tstar{font-size:16px;cursor:pointer;flex-shrink:0;touch-action:manipulation;min-width:24px;text-align:center}
.tdel{font-size:14px;cursor:pointer;flex-shrink:0;touch-action:manipulation;min-width:24px;text-align:center;opacity:0.5}
.rate-row{display:flex;gap:6px;margin-top:8px}
.rb{
  flex:1;background:var(--card2);border:2px solid var(--border);border-radius:10px;
  padding:8px 4px;color:var(--text2);font-size:12px;cursor:pointer;text-align:center;
  transition:all 0.2s;min-height:44px;font-family:inherit;touch-action:manipulation;
}
.rb:active{transform:scale(0.96)}
.rb.rb-on{background:rgba(255,217,61,0.2);border-color:var(--gold);color:var(--gold);font-weight:700}
.rb.rb-half{background:rgba(0,210,106,0.2);border-color:var(--green);color:var(--green);font-weight:700}
.rew-info{text-align:center;font-size:12px;color:var(--gold);margin-top:4px}
.summary{text-align:center;font-size:13px;color:var(--text2);padding:8px}
.empty{text-align:center;padding:32px;color:var(--text2);font-size:14px;line-height:1.8}

/* TEMPLATES */
.btn-new-tpl{
  width:100%;background:linear-gradient(135deg,#059669,#10b981);
  border:none;border-radius:12px;padding:12px;color:#fff;font-size:15px;
  font-weight:600;cursor:pointer;margin-bottom:10px;font-family:inherit;touch-action:manipulation;
}
.tpl-list{}
.tpl-item{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;overflow:hidden}
.tpl-head{
  padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;
  touch-action:manipulation;
}
.tpl-head:active{background:rgba(255,255,255,0.03)}
.tpl-nm{flex:1;font-weight:600;font-size:14px}
.tpl-ct{font-size:12px;color:var(--text2)}
.tpl-chev{font-size:18px;color:var(--text2)}
.tpl-body{padding:0 14px 12px;border-top:1px solid var(--border)}
.tpl-tasks{margin:8px 0}
.tpl-t{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--card2)}
.tpl-t:last-child{border-bottom:none}
.tpl-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tplbtn{
  flex:1;min-width:90px;padding:8px 6px;border-radius:10px;font-size:12px;
  cursor:pointer;text-align:center;border:1px solid;font-family:inherit;
  touch-action:manipulation;min-height:40px;
}
.tplbtn:active{transform:scale(0.97)}
.tpl-use{background:rgba(0,210,106,0.15);border-color:var(--green);color:var(--green)}
.tpl-ed{background:rgba(157,78,221,0.15);border-color:var(--purple);color:var(--purple2)}
.tpl-del{background:rgba(255,107,107,0.15);border-color:var(--red);color:var(--red)}

/* TEMPLATE EDITOR */
.tpl-editor{background:var(--card);border:2px solid var(--purple);border-radius:14px;padding:14px}
.tpl-name-row{margin-bottom:10px}
.tpl-name-in{
  width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:#fff;font-size:15px;outline:none;font-family:inherit;
}
.tpl-name-in:focus{border-color:var(--purple)}
.tpl-tasks-area{margin-bottom:8px}
.tpl-task-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tpl-sel{
  background:var(--card2);border:1px solid var(--border);border-radius:8px;
  color:#fff;font-size:16px;padding:4px;min-width:44px;cursor:pointer;font-family:inherit;
}
.tpl-in{
  flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;color:#fff;font-size:13px;outline:none;font-family:inherit;
}
.tpl-in:focus{border-color:var(--purple)}
.btn-add-task{
  width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:10px;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:10px;
  font-family:inherit;
}
.tpl-editor-btns{display:flex;gap:8px}
.tpl-save{flex:1;background:linear-gradient(135deg,#7c3aed,#9d4edd);border:none;border-radius:10px;padding:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;min-height:44px}
.tpl-cancel{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation;min-height:44px}

/* WEAPONS PAGE */
.wp-section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;text-align:center}
.weapons-scroll{max-height:45vh;overflow-y:auto;margin-bottom:14px}
.tier-section{margin-bottom:12px}
.tier-header{
  font-size:13px;font-weight:700;padding:5px 10px;
  border-left:4px solid;border-radius:0 8px 8px 0;
  margin-bottom:6px;background:var(--card);
}
.wp-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
@media (min-width:400px){
  .wp-grid{grid-template-columns:repeat(5,1fr)}
}
.wp-chip{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:6px 2px;text-align:center;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.wp-chip.wp-cur{border-color:var(--purple);background:rgba(157,78,221,0.15);box-shadow:0 0 8px rgba(157,78,221,0.3)}
.wp-chip.wp-owned{opacity:1}
.wp-emoji{font-size:18px}
.wp-ch-name{font-size:9px;color:var(--text);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-ch-lv{font-size:8px;color:var(--text2)}
.wp-cur-badge{font-size:10px}

/* ACHIEVEMENTS */
.ach-section{}
.ach-title{font-size:16px;font-weight:700;margin-bottom:10px}
.ach-item{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;margin-bottom:6px;
}
.ach-item.ach-on{border-color:var(--gold);background:rgba(255,215,0,0.06)}
.ach-ic{font-size:22px;min-width:32px;text-align:center}
.ach-info{flex:1}
.ach-lb{font-weight:600;font-size:14px}
.ach-ds{font-size:11px;color:var(--text2)}

/* BOTTOM NAV */
.nav{
  display:flex;background:var(--bg2);border-top:1px solid var(--border);
  flex-shrink:0;padding:4px 0;
}
.nav-btn{
  flex:1;background:none;border:none;color:var(--text2);font-size:22px;
  padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;transition:all 0.2s;border-radius:8px;margin:2px 4px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.nav-btn span{font-size:10px;font-family:inherit}
.nav-btn.active{color:var(--purple2);background:rgba(157,78,221,0.15)}
.nav-btn:active{transform:scale(0.9)}

/* SETTINGS */
.settings-panel{
  display:none;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:12px;
}
.settings-panel h3{font-size:14px;color:var(--text);margin-bottom:10px}
.settings-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.settings-btn-sm{
  flex:1;min-width:80px;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;color:var(--text);font-size:12px;
  cursor:pointer;text-align:center;font-family:inherit;touch-action:manipulation;
}
.settings-btn-sm.danger{border-color:var(--red);color:var(--red)}
.settings-info{font-size:11px;color:var(--text2);margin-top:6px}

/* NAME MODAL */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  background:linear-gradient(135deg,var(--card) 0%,var(--bg2) 100%);
  border:2px solid var(--purple);border-radius:20px;padding:28px 24px;
  width:100%;max-width:360px;text-align:center;
  box-shadow:0 0 40px rgba(157,78,221,0.4);
}
.modal h2{font-size:22px;color:var(--gold);margin-bottom:6px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:20px}
.modal input{
  width:100%;background:var(--card2);border:2px solid var(--border);border-radius:12px;
  padding:12px 16px;color:#fff;font-size:16px;text-align:center;margin-bottom:16px;outline:none;font-family:inherit;
}
.modal input:focus{border-color:var(--purple)}
.modal-btn{
  width:100%;background:linear-gradient(135deg,#7c3aed,#9d4edd);border:none;
  border-radius:12px;padding:12px;color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;touch-action:manipulation;min-height:48px;
}

/* SOUND TOGGLE */
.sound-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.sound-label{font-size:13px;color:var(--text)}
.toggle-switch{
  width:44px;height:24px;background:var(--card2);border-radius:12px;
  position:relative;cursor:pointer;border:1px solid var(--border);
  transition:all 0.3s;
}
.toggle-switch.on{background:var(--green);border-color:var(--green)}
.toggle-switch::after{
  content:'';position:absolute;width:18px;height:18px;
  background:#fff;border-radius:50%;top:2px;left:2px;
  transition:all 0.3s;
}
.toggle-switch.on::after{left:22px}
</style>
</head>
<body>

<div class="header">
  <h1>⚔️ 武器收集大作战 🎯</h1>
  <div class="header-sub">完成作业 → 收集武器 → 成为传奇！</div>
  <button class="settings-btn" onclick="toggleSettings()" title="设置">⚙️</button>
</div>

<div id="settings-panel" class="settings-panel">
  <h3>⚙️ 设置与数据</h3>
  <div class="sound-row">
    <span class="sound-label">🔊 音效反馈</span>
    <div class="toggle-switch" id="sound-toggle" onclick="toggleSound()"></div>
  </div>
  <div class="settings-row" style="margin-top:10px">
    <button class="settings-btn-sm" onclick="exportData()">📤 导出备份</button>
    <label class="settings-btn-sm" style="cursor:pointer">
      📥 导入
      <input type="file" accept=".json" style="display:none" onchange="importData(this)" />
    </label>
  </div>
  <div class="settings-row">
    <button class="settings-btn-sm danger" onclick="resetData()">🗑️ 重置数据</button>
    <button class="settings-btn-sm" onclick="openNameModal()">✏️ 改名字</button>
  </div>
  <div class="settings-info">数据保存在本地，换手机需要导出备份~</div>
</div>

<div class="main">
  <div id="page-home" class="page"><div id="home-content"></div></div>
  <div id="page-tasks" class="page"><div id="tasks-content"></div></div>
  <div id="page-weapons" class="page"><div id="weapons-content"></div></div>
</div>

<div class="nav">
  <button class="nav-btn active" data-page="home" onclick="showPage('home')">
    🏠<span>首页</span>
  </button>
  <button class="nav-btn" data-page="tasks" onclick="showPage('tasks')">
    📋<span>任务</span>
  </button>
  <button class="nav-btn" data-page="weapons" onclick="showPage('weapons')">
    ⚔️<span>武器</span>
  </button>
</div>

<div id="name-modal" class="modal-overlay">
  <div class="modal">
    <h2>⚔️ 欢迎来到武器大陆！</h2>
    <p>请输入你的名字，开启冒险之旅~</p>
    <input type="text" id="name-input" placeholder="例如: 小明" maxlength="20" />
    <button class="modal-btn" onclick="saveName()">🚀 开始冒险！</button>
  </div>
</div>

<script>// Weapon Quest Game - game.js
var WEAPONS = [
  {lv:1,n:"玩具水枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:2,n:"小弹弓枪",e:"\ud83c\udff9",t:1,tn:"起始之枪"},
  {lv:3,n:"橡皮筋枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:4,n:"软弹枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:5,n:"木制手枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:6,n:"塑料步枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:7,n:"弹簧手枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:8,n:"水弹枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:9,n:"儿童猎枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:10,n:"泡沫冲锋枪",e:"\ud83d\udd2b",t:1,tn:"起始之枪"},
  {lv:11,n:"电动冲锋枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:12,n:"加特林玩具枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:13,n:"电光枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:14,n:"电磁步枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:15,n:"闪电冲锋枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:16,n:"能量光枪",e:"\u26a1",t:2,tn:"能量之枪"},
  {lv:17,n:"电弧手枪",e:"\u26a1",t:2,tn:"能量之枪"},

var state = {
  name:"",gold:0,xp:0,level:1,currentWp:0,fragments:0,
  ownedWp:[],streak:0,totalDone:0,lastDate:"",tasks:[],history:[],
  templates:[],createdAt:"",soundEnabled:true
};

var currentPage = "home";

var editingTemplateId = null;
var selectedIcon = "\ud83d\udcdd";
var STORAGE_KEY = "wpquest_v2";

function xpForLevel(lv) { return lv * 100; }
function todayStr() { return new Date().toISOString().split("T")[0]; }
function yesterdayStr() {
  var d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().split("T")[0];
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var p = JSON.parse(raw);
    state.name        = p.name        || "";
    state.gold       = p.gold        || 0;
    state.xp         = p.xp          || 0;
    state.level      = p.level       || 1;
    state.currentWp  = p.currentWp   || 0;
    state.fragments  = p.fragments   || 0;
    state.ownedWp    = p.ownedWp     || [];
    state.streak     = p.streak      || 0;
    state.totalDone  = p.totalDone   || 0;
    state.lastDate   = p.lastDate    || "";
    state.tasks      = p.tasks       || [];
    state.history    = p.history     || [];
    state.templates  = p.templates   || [];
    state.createdAt  = p.createdAt   || "";
    state.soundEnabled = p.soundEnabled !== undefined ? p.soundEnabled : true;
    return true;
  } catch(e) { return false; }
}

function resetDailyTasks() {
  var today = todayStr();
  if (state.lastDate && state.lastDate !== today) {
    state.tasks.forEach(function(t) {
      t.done = false;
      t.rating = null;
    });
  }
}

function updateStreak() {
  var today = todayStr();
  if (state.lastDate === today) return;
  var yStr = yesterdayStr();
  if (state.lastDate === yStr) {
    state.streak = (state.streak || 0) + 1;
  } else if (state.lastDate && state.lastDate !== today) {
    state.streak = 1;
  } else if (!state.lastDate) {
    state.streak = 1;
  }
  state.lastDate = today;
}

function addTask(text, icon) {
  if (!text || !text.trim()) return;
  state.tasks.push({
    id: Date.now(),
    text: text.trim(),
    icon: icon || selectedIcon,
    done: false,
    rating: null,
    important: false,
    fromTemplate: null
  });
  save();
  renderTasks();
}

function toggleTask(id) {
  for (var i = 0; i < state.tasks.length; i++) {
    if (state.tasks[i].id === id) {
      state.tasks[i].done = !state.tasks[i].done;
      if (!state.tasks[i].done) state.tasks[i].rating = null;
      break;
    }
  }
  save();
  renderTasks();
}

function rateTask(id, rating) {
  for (var i = 0; i < state.tasks.length; i++) {
    var t = state.tasks[i];
    if (t.id !== id) continue;
    if (!t.done) return;
    var prev = t.rating;
    if (prev === rating) {
      refundTask(t);
      t.rating = null;
      t.done = false;
    } else {
      if (prev) refundTask(t);
      applyRating(t, rating);
      t.rating = rating;
    }
    break;
  }
  save();
  refreshDisplay();
  renderTasks();
}

function refundTask(task) {
  var r = task.rating;
  if (r === "full") {
    state.gold -= 10; state.xp -= 5; state.fragments -= 1; state.totalDone -= 1;
  } else if (r === "partial") {
    state.gold -= 6; state.xp -= 3; state.totalDone -= 1;
  }
  if (state.gold < 0) state.gold = 0;
  if (state.xp < 0) state.xp = 0;
  if (state.fragments < 0) state.fragments = 0;
}

function applyRating(task, rating) {
  updateStreak();
  var gold = 0, xp = 0, frags = 0;
  if (rating === "full")   { gold = 10; xp = 5; frags = 1; state.totalDone++; }
  else if (rating === "partial") { gold = 6; xp = 3; state.totalDone++; }
  state.gold += gold;
  state.xp += xp;
  state.fragments += frags;
  state.history.unshift({ text: task.text, rating: rating, date: todayStr(), gold: gold, xp: xp });
  var needed = xpForLevel(state.level);
  if (state.xp >= needed) {
    state.xp -= needed; state.level++;
    setTimeout(confettiBurst, 100);
  }
  checkWeaponUnlock();
  state.lastDate = todayStr();
}

function checkWeaponUnlock() {
  while (state.fragments >= 10) {
    var nextLv = (state.currentWp || 0) + 1;
    if (nextLv > 100) break;
    state.currentWp = nextLv;
    state.fragments -= 10;
    if (state.ownedWp.indexOf(nextLv) === -1) state.ownedWp.push(nextLv);
    setTimeout(confettiBurst, 100);
  }
}

function confettiBurst() {
  var colors = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#c77dff","#ff9f1c","#00f5d4"];
  for (var i = 0; i < 50; i++) {
    (function(i) {
      var dot = document.createElement("div");
      var size = 4 + Math.random() * 8;
      var color = colors[Math.floor(Math.random() * colors.length)];
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 200;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist - 80;
      var duration = 0.8 + Math.random() * 1.0;
      var rotation = Math.random() * 720 - 360;
      var prefix = "cf" + Date.now();
      dot.style.cssText = [
        "position:fixed","top:50%","left:50%",
        "width:"+size+"px","height:"+size+"px","background:"+color,
        "border-radius:"+(Math.random()>0.5?"50%":"2px"),
        "pointer-events:none","z-index:99999",
        "transform:translate(-50%,-50%)",
        "animation:"+prefix+i+" "+duration+"s ease-out forwards"
      ].join(";");
      document.body.appendChild(dot);
      var st = document.createElement("style");
      st.textContent = "@keyframes "+prefix+i+" {0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate("+tx+"px,"+ty+"px) rotate("+rotation+"deg);opacity:0}}";
      document.head.appendChild(st);
      setTimeout(function() { dot.remove(); st.remove(); }, (duration + 0.3) * 1000);
    })(i);
  }
}

function showPage(page) {
  currentPage = page;
  var pages = ["home","tasks","weapons"];
  for (var i = 0; i < pages.length; i++) {
    var el = document.getElementById("page-" + pages[i]);
    if (el) el.style.display = pages[i] === page ? "block" : "none";
  }
  var btns = document.querySelectorAll(".nav-btn");
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle("active", btns[j].dataset.page === page);
  }
  if (page === "home") renderHome();
  else if (page === "tasks") { taskView = "list"; renderTasks(); }
  else if (page === "weapons") renderWeapons();
}

function refreshDisplay() { renderHome(); }

function getCurrentWeapon() {
  var lv = state.currentWp || 0;
  return lv === 0 ? WEAPONS[0] : (WEAPONS[lv - 1] || WEAPONS[0]);
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderTasks() {
  var el = document.getElementById("tasks-content");
  if (!el) return;

  if (taskView === "templates") {
    renderTemplates(el);
    return;
  }

  var tasks = state.tasks.slice().sort(function(a, b) {
    if (a.important !== b.important) return a.important ? -1 : 1;
    if (a.done !== b.done) return a.done ? 1 : -1;
    return 0;
  });

  var todayDone = 0;
  for (var i = 0; i < state.tasks.length; i++) {
    if (state.tasks[i].done && state.tasks[i].rating) todayDone++;
  }

  var html =
    '<div class="view-tabs">' +
      '<button class="tab-btn active" onclick="switchView(\'list\')">&#128203; 任务</button>' +
      '<button class="tab-btn" onclick="switchView(\'templates\')">&#128218; 模板</button>' +
    '</div>' +

    '<div class="icon-row">' +
      TASK_ICONS.map(function(ic) {
        return '<span class="ic-opt' + (selectedIcon === ic ? ' ic-sel' : '') + '" onclick="selectIcon(\'' + ic.replace(/\u/g,"\\u") + '\')">' + ic + '</span>';
      }).join("") +
    '</div>' +

    '<div class="add-row">' +
      '<input type="text" id="task-input" placeholder="输入任务，按回车添加..." ' +
        'maxlength="50" inputmode="text" enterkeyhint="done" autocomplete="off" ' +
        'onkeydown="if(event.key===\'Enter\')handleAddTask()" />' +
      '<button class="btn-add" onclick="handleAddTask()">&#10133;</button>' +
    '</div>' +

    '<div class="task-list">';

  if (tasks.length === 0) {
    html += '<div class="empty">还没有任务，添加一个吧！&#10024;</div>';
  } else {
    for (var j = 0; j < tasks.length; j++) {
      var t = tasks[j];
      html +=
        '<div class="task-item' + (t.done ? ' task-done' : '') + (t.important ? ' task-imp' : '') + '">' +
          '<div class="task-row">' +
            '<span class="tcheck" onclick="toggleTask(' + t.id + ')">' + (t.done ? '&#9989;' : '&#11036;') + '</span>' +
            '<span class="ticon">' + t.icon + '</span>' +
            '<span class="ttext' + (t.done ? ' tdone' : '') + '">' + escHtml(t.text) + '</span>' +
            '<span class="tstar" onclick="toggleImp(' + t.id + ')">' + (t.important ? '&#11088;' : '&#9734;') + '</span>' +
            '<span class="tdel" onclick="delTask(' + t.id + ')">&#128465;</span>' +
          '</div>' +
          (t.done ? (
            '<div class="rate-row">' +
              '<button class="rb' + (t.rating==='full'?' rb-on':'') + '" onclick="rateTask('+t.id+',\'full\')">&#11088;&#11088;&#11088;</button>' +
              '<button class="rb' + (t.rating==='partial'?' rb-half':'') + '" onclick="rateTask('+t.id+',\'partial\')">&#11088;&#11088;</button>' +
            '</div>' +
            (t.rating ? '<div class="rew-info">' +
              (t.rating==="full"?"+10&#128176; +5&#9733; +1&#9830;":t.rating==="partial"?"+6&#128176; +3&#9733;":"+0") +
            '</div>' : '')
          ) : '') +
        '</div>';
    }
  }

  html += '</div><div class="summary">今日完成 ' + todayDone + ' 个</div>';
  el.innerHTML = html;
}

function selectIcon(ic) { selectedIcon = ic; renderTasks(); }
function switchView(v) { taskView = v; renderTasks(); }

function handleAddTask() {
  var input = document.getElementById("task-input");
  if (!input || !input.value.trim()) return;
  addTask(input.value.trim(), selectedIcon);
  input.value = "";
}

function toggleImp(id) {
  for (var i = 0; i < state.tasks.length; i++) {
    if (state.tasks[i].id === id) {
      state.tasks[i].important = !state.tasks[i].important;
      break;
    }
  }
  save();
  renderTasks();
}

function delTask(id) {
  state.tasks = state.tasks.filter(function(t) { return t.id !== id; });
  save();
  renderTasks();
}

// ---- TEMPLATES ----
function renderTemplates(el) {
  var html =
    '<div class="view-tabs">' +
      '<button class="tab-btn" onclick="switchView(\'list\')">&#128203; 任务</button>' +
      '<button class="tab-btn active" onclick="switchView(\'templates\')">&#128218; 模板</button>' +
    '</div>';

  if (editingTemplateId !== null) {
    html += renderTemplateEditor();
  } else {
    html += '<button class="btn-new-tpl" onclick="newTemplate()">&#10133; 新建模板</button><div class="tpl-list">';
    if (state.templates.length === 0) {
      html += '<div class="empty">没有模板<br>比如创建一个"每天必做"模板<br>一次添加多个任务~</div>';
    } else {
      for (var i = 0; i < state.templates.length; i++) {
        var tmpl = state.templates[i];
        html +=
          '<div class="tpl-item">' +
            '<div class="tpl-head" onclick="toggleTpl(' + i + ')">' +
              '<span class="tpl-nm">' + escHtml(tmpl.name) + '</span>' +
              '<span class="tpl-ct">' + tmpl.tasks.length + '个任务</span>' +
              '<span class="tpl-chev" id="tc' + i + '">&rsaquo;</span>' +
            '</div>' +
            '<div class="tpl-body" id="tb' + i + '" style="display:none">' +
              '<div class="tpl-tasks">';
        for (var j = 0; j < tmpl.tasks.length; j++) {
          html += '<div class="tpl-t"><span>' + tmpl.tasks[j].icon + '</span><span>' + escHtml(tmpl.tasks[j].text) + '</span></div>';
        }
        html += '</div>' +
          '<div class="tpl-btns">' +
            '<button class="tplbtn tpl-use" onclick="useTemplate(' + i + ')">&#9654; 添加到今日</button>' +
            '<button class="tplbtn tpl-ed" onclick="editTemplate(' + i + ')">&#9998; 编辑</button>' +
            '<button class="tplbtn tpl-del" onclick="deleteTemplate(' + i + ')">&#128465; 删除</button>' +
          '</div>' +
        '</div></div>';
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function toggleTpl(i) {
  var body = document.getElementById("tb" + i);
  var chev = document.getElementById("tc" + i);
  if (!body) return;
  var show = body.style.display === "none";
  body.style.display = show ? "block" : "none";
  if (chev) chev.innerHTML = show ? "&#9660;" : "&rsaquo;";
}

function newTemplate() { editingTemplateId = -1; renderTasks(); }
function editTemplate(i) { editingTemplateId = i; renderTasks(); }

function renderTemplateEditor() {
  var isNew = editingTemplateId === -1;
  var tmpl = isNew ? { name: "", tasks: [] } : state.templates[editingTemplateId];
  var tasks = tmpl.tasks || [];

  var rows = tasks.map(function(t, i) {
    var opts = TASK_ICONS.map(function(ic) {
      var sel = t.icon === ic ? ' selected' : '';
      return '<option value="' + ic + '"' + sel + '>' + ic + '</option>';
    }).join('');
    return '<div class="tpl-task-row">' +
      '<select class="tpl-sel" onchange="updateTplTask(' + i + ',\'icon\',this.value)">' + opts + '</select>' +
      '<input type="text" class="tpl-in" value="' + escHtml(t.text) + '" onchange="updateTplTask(' + i + ',\'text\',this.value)" />' +
      '<button class="tdel" onclick="removeTplTask(' + i + ')">&#128465;</button>' +
    '</div>';
  }).join('');

  return '<div class="tpl-editor">' +
    '<div class="tpl-name-row">' +
      '<input type="text" id="tpl-name" class="tpl-name-in" placeholder="模板名称..." value="' + escHtml(tmpl.name) + '" />' +
    '</div>' +
    '<div class="tpl-tasks-area">' + rows + '</div>' +
    '<button class="btn-add-task" onclick="addTplTask()">&#10133; 添加任务</button>' +
    '<div class="tpl-editor-btns">' +
      '<button class="tplbtn tpl-save" onclick="saveTemplate()">&#128190; 保存模板</button>' +
      '<button class="tplbtn tpl-cancel" onclick="cancelTemplate()">&#10006; 取消</button>' +
    '</div>' +
  '</div>';
}

function addTplTask() {
  var isNew = editingTemplateId === -1;
  if (isNew) {
    if (!window._tplDraft) window._tplDraft = { name: '', tasks: [] };
    var nameEl = document.getElementById('tpl-name');
    if (nameEl) window._tplDraft.name = nameEl.value;
    window._tplDraft.tasks.push({ icon: '\ud83d\udcdd', text: '' });
  } else {
    state.templates[editingTemplateId].tasks.push({ icon: '' + selectedIcon, text: '' });
  }
  var el = document.getElementById('tasks-content');
  if (el) el.innerHTML = renderTemplateEditor();
}

function updateTplTask(idx, field, val) {
  var isNew = editingTemplateId === -1;
  if (isNew) {
    if (!window._tplDraft) return;
    if (!window._tplDraft.tasks[idx]) window._tplDraft.tasks[idx] = {};
    window._tplDraft.tasks[idx][field] = val;
  } else {
    state.templates[editingTemplateId].tasks[idx][field] = val;
  }
}

function removeTplTask(idx) {
  var isNew = editingTemplateId === -1;
  if (isNew) {
    if (!window._tplDraft) return;
    window._tplDraft.tasks.splice(idx, 1);
  } else {
    state.templates[editingTemplateId].tasks.splice(idx, 1);
  }
  var el = document.getElementById('tasks-content');
  if (el) el.innerHTML = renderTemplateEditor();
}

function saveTemplate() {
  var isNew = editingTemplateId === -1;
  var nameEl = document.getElementById('tpl-name');
  var name = nameEl ? nameEl.value.trim() : '';
  if (!name) { alert('请输入模板名称！'); return; }
  var tasks;
  if (isNew) {
    if (window._tplDraft) {
      tasks = window._tplDraft.tasks.filter(function(t) { return t.text && t.text.trim(); });
    } else {
      tasks = [];
    }
  } else {
    tasks = state.templates[editingTemplateId].tasks.filter(function(t) { return t.text && t.text.trim(); });
  }
  if (tasks.length === 0) { alert('请至少添加一个任务！'); return; }
  var tmpl = { id: isNew ? Date.now() : state.templates[editingTemplateId].id, name: name, tasks: tasks };
  if (isNew) {
    state.templates.push(tmpl);
  } else {
    state.templates[editingTemplateId] = tmpl;
  }
  window._tplDraft = null;
  editingTemplateId = null;
  save();
  taskView = 'templates';
  renderTasks();
}

function cancelTemplate() {
  window._tplDraft = null;
  editingTemplateId = null;
  renderTasks();
}

function useTemplate(idx) {
  var tmpl = state.templates[idx];
  if (!tmpl || !tmpl.tasks.length) return;
  for (var i = 0; i < tmpl.tasks.length; i++) {
    addTask(tmpl.tasks[i].text, tmpl.tasks[i].icon);
  }
  taskView = 'list';
  renderTasks();
}

function deleteTemplate(idx) {
  if (!confirm('确定删除这个模板？')) return;
  state.templates.splice(idx, 1);
  save();
  renderTasks();
}

function exportData() {
  var dataStr = JSON.stringify(state, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'weaponquest_backup_' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(fileInput) {
  var file = fileInput.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      if (imported && typeof imported === 'object') {
        state.name=imported.name||'';state.gold=imported.gold||0;state.xp=imported.xp||0;
        state.level=imported.level||1;state.currentWp=imported.currentWp||0;state.fragments=imported.fragments||0;
        state.ownedWp=imported.ownedWp||[];state.streak=imported.streak||0;state.totalDone=imported.totalDone||0;
        state.lastDate=imported.lastDate||'';state.tasks=imported.tasks||[];state.history=imported.history||[];
        state.templates=imported.templates||[];state.createdAt=imported.createdAt||'';
        state.soundEnabled=imported.soundEnabled!==undefined?imported.soundEnabled:true;
        save(); refreshDisplay(); showPage('home');
        alert('\u2705 数据导入成功！');
      }
    } catch(err) { alert('\u274c 导入失败：' + err.message); }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm('\u26a0\ufe0f 确定重置？数据不可恢复！')) return;
  state = {name:'',gold:0,xp:0,level:1,currentWp:0,fragments:0,ownedWp:[],streak:0,totalDone:0,lastDate:'',tasks:[],history:[],templates:[],createdAt:new Date().toISOString(),soundEnabled:true};
  save();
  refreshDisplay(); showPage('home');
  openNameModal();
}

function toggleSettings() {
  var panel = document.getElementById('settings-panel');
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' || !panel.style.display ? 'block' : 'none';
}

function openNameModal() {
  var modal = document.getElementById('name-modal');
  if (!modal) return;
  var input = document.getElementById('name-input');
  if (input) input.value = state.name || '';
  modal.classList.add('show');
}

function closeNameModal() {
  var modal = document.getElementById('name-modal');
  if (modal) modal.classList.remove('show');
}

function saveName() {
  var input = document.getElementById('name-input');
  state.name = input ? (input.value.trim() || '\u5c0f\u52c7\u58eb') : '\u5c0f\u52c7\u58eb';
  if (!state.createdAt) state.createdAt = new Date().toISOString();
  save();
  closeNameModal();
  renderHome();
}

function doSetup() {
  var hasData = load();
  resetDailyTasks();
  if (!hasData || !state.name) { openNameModal(); }
  else { closeNameModal(); updateStreak(); showPage('home'); }
}

function initApp() { doSetup(); }

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') save();
});
</script>

});
function toggleSound() {

}
